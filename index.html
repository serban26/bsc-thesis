<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SDN Round-Robin Load Balancer – Live Schedule View</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#020617;
  color:#e5e7eb
}
h1{
  text-align:center;
  font-size:1.4rem;
  margin:1rem 0 .25rem
}
.subtitle{
  text-align:center;
  font-size:.8rem;
  color:#9ca3af;
  margin-bottom:.75rem
}
.toolbar{
  display:flex;
  gap:1rem;
  padding:.5rem 2rem .75rem;
  align-items:flex-start
}
.toolbar-left{flex:2}
.toolbar-right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:.5rem;
  align-items:flex-end
}
.textarea-wrapper{
  background:#020617;
  border-radius:.75rem;
  border:1px solid #1f2937;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  padding:.5rem .75rem .75rem
}
.textarea-title{
  font-size:.8rem;
  margin-bottom:.35rem;
  color:#facc15
}
textarea{
  width:100%;
  min-height:140px;
  resize:vertical;
  border-radius:.5rem;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
  padding:.4rem .5rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  font-size:.75rem
}
button{
  border:none;
  border-radius:999px;
  padding:.4rem .9rem;
  font-size:.8rem;
  font-weight:500;
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background .15s ease,color .15s ease
}
button:disabled{
  opacity:.4;
  cursor:default;
  transform:none;
  box-shadow:none
}
.btn-primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#020617;
  box-shadow:0 8px 20px rgba(34,197,94,.35)
}
.btn-primary:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 10px 28px rgba(34,197,94,.45)
}
.btn-secondary{
  background:#0f172a;
  color:#e5e7eb;
  border:1px solid #1f2937
}
.btn-secondary:hover:not(:disabled){
  background:#111827;
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(15,23,42,.6)
}
.status-row{
  display:flex;
  align-items:center;
  gap:.4rem
}
.status-text{
  font-size:.75rem;
  color:#9ca3af
}
.status-text strong{color:#e5e7eb}
.spinner{
  width:16px;
  height:16px;
  border-radius:999px;
  border:2px solid rgba(148,163,184,.4);
  border-top-color:#22c55e;
  animation:spin .8s linear infinite;
  display:inline-block;
  vertical-align:middle
}
.hidden{display:none}
.log-panel{
  margin-top:.25rem;
  max-height:120px;
  overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  font-size:.7rem;
  padding:.35rem .5rem;
  border-radius:.5rem;
  background:#020617;
  border:1px solid #1f2937;
  color:#9ca3af
}
.log-panel-line-highlight{color:#e5e7eb}
.timeline{
  font-size:.75rem;
  color:#9ca3af
}
.timeline strong{color:#e5e7eb}
.container{
  display:grid;
  grid-template-columns:1.1fr 2.1fr;
  gap:1rem;
  padding:.5rem 2rem 2rem
}
.column{
  display:flex;
  flex-direction:column;
  gap:1rem
}
.card{
  background:#020617;
  border-radius:.75rem;
  padding:.75rem 1rem;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  border:1px solid #1f2937;
  opacity:0;
  transform:translateY(8px);
  animation:fadeUp .35s ease forwards
}
.card-title{
  font-size:.95rem;
  font-weight:600;
  margin-bottom:.5rem;
  color:#facc15
}
.list{
  list-style:none;
  padding:0;
  margin:0;
  font-size:.8rem
}
.list li{
  padding:.15rem 0;
  border-bottom:1px solid rgba(55,65,81,.5);
  opacity:0;
  transform:translateX(-4px);
  animation:fadeRow .3s ease forwards
}
.list li:last-child{border-bottom:none}
.badge{
  display:inline-block;
  padding:.05rem .4rem;
  border-radius:999px;
  font-size:.7rem;
  margin-left:.25rem
}
.badge-pending{
  background:rgba(248,250,252,.06);
  color:#e5e7eb
}
.badge-active{
  background:rgba(59,130,246,.15);
  color:#60a5fa
}
.badge-solved{
  background:rgba(34,197,94,.15);
  color:#4ade80
}
.badge-failed{
  background:rgba(239,68,68,.18);
  color:#f87171
}
.servers-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:.75rem
}
.small{
  font-size:.75rem;
  color:#9ca3af
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeRow{to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<h1>SDN Round-Robin Load Balancer – Live Schedule View</h1>
<div class="subtitle">Edit the workload, run the experiment, and watch requests move from client to servers over time.</div>
<div class="toolbar">
  <div class="toolbar-left">
    <div class="textarea-wrapper">
      <div class="textarea-title">input/input.txt</div>
      <textarea id="input-editor" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="toolbar-right">
    <button id="save-btn" class="btn-secondary">Save input</button>
    <button id="run-btn" class="btn-primary">Run experiment</button>
    <div class="status-row">
      <span id="spinner" class="spinner hidden"></span>
      <span id="status-label" class="status-text"><strong>Idle.</strong> Edit input and click Run experiment.</span>
    </div>
    <div class="timeline">
      <span id="timeline-label"><strong>Sim time:</strong> 0 ms</span>
    </div>
    <div id="log-panel" class="log-panel hidden"></div>
  </div>
</div>
<div class="container">
  <div class="column">
    <div class="card">
      <div class="card-title">Client</div>
      <ul id="client-list" class="list"></ul>
    </div>
  </div>
  <div class="column">
    <div class="card">
      <div class="card-title">Servers</div>
      <div id="servers" class="servers-grid"></div>
    </div>
  </div>
</div>
<script>
let globalSchedule=[];
let animTimer=null;

function parseCsv(text){
  const lines=text.trim().split(/\r?\n/);
  if(!lines.length)return[];
  const header=lines[0].split(",");
  return lines.slice(1).filter(Boolean).map(line=>{
    const cols=line.split(",");
    const obj={};
    header.forEach((h,i)=>{
      obj[h.trim()]=cols[i]?cols[i].trim():"";
    });
    obj.arrival_ms=obj.arrival_ms?parseInt(obj.arrival_ms,10):null;
    obj.start_ms=obj.start_ms?parseInt(obj.start_ms,10):null;
    obj.finish_ms=obj.finish_ms?parseInt(obj.finish_ms,10):null;
    return obj;
  });
}

function computeStatus(row,nowMs){
  if(row.status==="too_consuming")return"failed";
  const a=row.arrival_ms;
  const s=row.start_ms;
  const f=row.finish_ms;
  if(a===null||s===null||f===null)return"pending";
  if(nowMs<a)return"future";
  if(nowMs<s)return"pending";
  if(nowMs<f)return"active";
  return"solved";
}

function renderAt(nowMs){
  const clientList=document.getElementById("client-list");
  const serversRoot=document.getElementById("servers");
  clientList.innerHTML="";
  serversRoot.innerHTML="";
  const byServer={};
  const rows=globalSchedule.map(r=>{
    const st=computeStatus(r,nowMs);
    return{...r,_status:st};
  });
  rows.forEach(row=>{
    const key=row.server||"unassigned";
    if(!byServer[key])byServer[key]=[];
    byServer[key].push(row);
  });
  const sortedByArrival=[...rows].sort((a,b)=>(a.arrival_ms||0)-(b.arrival_ms||0));
  sortedByArrival.forEach((row,idx)=>{
    const li=document.createElement("li");
    li.style.animationDelay=(idx*40)+"ms";
    li.textContent=row.name+" · "+(row.arrival_ms??"-")+" ms";
    const badge=document.createElement("span");
    badge.classList.add("badge");
    if(row._status==="active"){
      badge.classList.add("badge-active");
      badge.textContent="active";
    }else if(row._status==="pending"){
      badge.classList.add("badge-pending");
      badge.textContent="pending";
    }else if(row._status==="solved"){
      badge.classList.add("badge-solved");
      badge.textContent="solved";
    }else if(row._status==="failed"){
      badge.classList.add("badge-failed");
      badge.textContent="too consuming";
    }else{
      badge.classList.add("badge-pending");
      badge.textContent="future";
    }
    li.appendChild(badge);
    clientList.appendChild(li);
  });
  Object.keys(byServer).sort().forEach(serverName=>{
    const card=document.createElement("div");
    card.className="card";
    const title=document.createElement("div");
    title.className="card-title";
    title.textContent=serverName;
    card.appendChild(title);
    const ul=document.createElement("ul");
    ul.className="list";
    const items=byServer[serverName]
      .filter(r=>r._status==="active"||r._status==="pending")
      .sort((a,b)=>(a.start_ms||0)-(b.start_ms||0));
    if(!items.length){
      const li=document.createElement("li");
      li.style.animationDelay="0ms";
      li.innerHTML="<span class='small'>no active requests</span>";
      ul.appendChild(li);
    }else{
      items.forEach((row,idx)=>{
        const li=document.createElement("li");
        li.style.animationDelay=(idx*40)+"ms";
        const dur=row.finish_ms!==null&&row.start_ms!==null?row.finish_ms-row.start_ms:0;
        const state=row._status==="active"?"active":"pending";
        const badgeClass=row._status==="active"?"badge-active":"badge-pending";
        li.innerHTML="<strong>"+row.name+"</strong>"+
          "<span class='badge "+badgeClass+"'>"+state+"</span>"+
          "<div class='small'>start "+(row.start_ms??"-")+" · finish "+(row.finish_ms??"-")+" · "+dur+" ms</div>";
        ul.appendChild(li);
      });
    }
    card.appendChild(ul);
    serversRoot.appendChild(card);
  });
  document.getElementById("timeline-label").innerHTML="<strong>Sim time:</strong> "+Math.max(0,Math.round(nowMs))+" ms";
}

function setStatus(text,mode){
  const spinner=document.getElementById("spinner");
  const label=document.getElementById("status-label");
  if(mode==="running")spinner.classList.remove("hidden");else spinner.classList.add("hidden");
  label.innerHTML=text;
}

function appendLog(output){
  const panel=document.getElementById("log-panel");
  if(!output){
    panel.classList.add("hidden");
    panel.textContent="";
    return;
  }
  panel.classList.remove("hidden");
  const lines=output.trim().split(/\r?\n/);
  panel.innerHTML="";
  lines.forEach(line=>{
    const div=document.createElement("div");
    if(line.includes("LB DECISION"))div.className="log-panel-line-highlight";
    div.textContent=line;
    panel.appendChild(div);
  });
  panel.scrollTop=panel.scrollHeight;
}

function loadInput(){
  return fetch("/api/input")
    .then(r=>r.text())
    .then(t=>{
      document.getElementById("input-editor").value=t;
    });
}

function saveInput(){
  const content=document.getElementById("input-editor").value;
  return fetch("/api/input",{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:content
  });
}

function loadSchedule(animate){
  return fetch("/results/schedule.csv?"+Date.now())
    .then(r=>r.ok?r.text():"")
    .then(t=>{
      if(!t){
        globalSchedule=[];
        renderAt(0);
        return;
      }
      const data=parseCsv(t).filter(row=>row.name);
      globalSchedule=data;
      if(!animate){
        const finishTimes=[];
        globalSchedule.forEach(r=>{
          if(r.finish_ms!=null)finishTimes.push(r.finish_ms);
        });
        const last=finishTimes.length?Math.max(...finishTimes):0;
        renderAt(last);
        return;
      }
      startAnimation();
    });
}

function startAnimation(){
  if(!globalSchedule.length){
    renderAt(0);
    return;
  }
  if(animTimer){
    clearInterval(animTimer);
    animTimer=null;
  }
  const timesSet=new Set();
  globalSchedule.forEach(r=>{
    if(r.arrival_ms!=null)timesSet.add(r.arrival_ms);
    if(r.start_ms!=null)timesSet.add(r.start_ms);
    if(r.finish_ms!=null)timesSet.add(r.finish_ms);
  });
  const events=Array.from(timesSet).sort((a,b)=>a-b);
  if(!events.length){
    renderAt(0);
    return;
  }
  let idx=0;
  function step(){
    const now=events[idx];
    renderAt(now);
    idx++;
    if(idx>=events.length){
      clearInterval(animTimer);
      animTimer=null;
    }
  }
  step();
  animTimer=setInterval(step,1500);
}

function runExperiment(){
  const saveBtn=document.getElementById("save-btn");
  const runBtn=document.getElementById("run-btn");
  saveBtn.disabled=true;
  runBtn.disabled=true;
  setStatus("<strong>Running…</strong> This may take a few seconds.","running");
  appendLog("");
  if(animTimer){
    clearInterval(animTimer);
    animTimer=null;
  }
  renderAt(0);
  saveInput()
    .then(()=>fetch("/api/run",{method:"POST"}))
    .then(r=>r.json())
    .then(res=>{
      setStatus("<strong>Done.</strong> Exit code "+res.exit_code+".","idle");
      appendLog(res.output||"");
      return loadSchedule(true);
    })
    .catch(err=>{
      console.error(err);
      setStatus("<strong>Error.</strong> See console.","idle");
    })
    .finally(()=>{
      saveBtn.disabled=false;
      runBtn.disabled=false;
    });
}

document.getElementById("save-btn").addEventListener("click",function(){
  setStatus("<strong>Saving…</strong>","running");
  saveInput()
    .then(()=>{setStatus("<strong>Saved.</strong> You can now run the experiment.","idle");})
    .catch(err=>{
      console.error(err);
      setStatus("<strong>Error saving.</strong>","idle");
    });
});

document.getElementById("run-btn").addEventListener("click",function(){
  runExperiment();
});

loadInput()
  .then(()=>{
    globalSchedule=[];
    renderAt(0);
    return loadSchedule(false);
  })
  .catch(err=>{
    console.error(err);
    globalSchedule=[];
    renderAt(0);
  });
</script>
</body>
</html>
