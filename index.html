<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>SDN Round-Robin Load Balancer – Live Schedule View</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #020617;
            color: #e5e7eb
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin: 1rem 0 .25rem
        }

        .subtitle {
            text-align: center;
            font-size: .8rem;
            color: #9ca3af;
            margin-bottom: .75rem
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            padding: .5rem 2rem .25rem;
            align-items: flex-start
        }

        .toolbar-left {
            flex: 2
        }

        .toolbar-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            align-items: flex-end
        }

        .textarea-wrapper {
            background: #020617;
            border-radius: .75rem;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
            overflow: hidden;
            width: 100%;
            max-height: 420px;
            display: flex;
            flex-direction: column
        }

        .textarea-title {
            font-size: .8rem;
            padding: .4rem .6rem;
            border-bottom: 1px solid #111827;
            background: radial-gradient(circle at top left, #0f172a, #020617)
        }

        #input-editor {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: #e5e7eb;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: .75rem;
            padding: .55rem .6rem;
            line-height: 1.4;
            min-height: 260px
        }

        #input-editor::placeholder {
            color: #4b5563
        }

        .btn-primary,
        .btn-secondary {
            border-radius: 999px;
            padding: .4rem .85rem;
            font-size: .8rem;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-weight: 500;
            transition: background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .1s ease
        }

        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #022c22;
            box-shadow: 0 10px 25px rgba(34, 197, 94, .35)
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(34, 197, 94, .45)
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: default;
            transform: none;
            box-shadow: none
        }

        .btn-secondary {
            background: rgba(15, 23, 42, .8);
            color: #e5e7eb;
            border-color: #1f2937
        }

        .btn-secondary:hover {
            background: rgba(15, 23, 42, 1);
            border-color: #374151
        }

        .btn-secondary:disabled {
            opacity: .6;
            cursor: default
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-size: .8rem;
            color: #9ca3af
        }

        .status-text strong {
            color: #e5e7eb
        }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgba(148, 163, 184, .4);
            border-top-color: #22c55e;
            animation: spin 1s linear infinite
        }

        .hidden {
            display: none
        }

        .timeline {
            font-size: .75rem;
            color: #9ca3af
        }

        .console-wrapper {
            margin-top: .5rem
        }

        .console-title {
            font-size: .75rem;
            color: #9ca3af;
            margin-bottom: .15rem
        }

        .log-panel {
            max-height: 120px;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: .7rem;
            padding: .35rem .5rem;
            border-radius: .5rem;
            background: #020617;
            border: 1px solid #1f2937;
            color: #9ca3af
        }

        .log-panel-line-highlight {
            color: #e5e7eb
        }

        .container {
            display: grid;
            grid-template-columns: 1.1fr 2.1fr;
            gap: 1rem;
            padding: .5rem 2rem 2rem
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1rem
        }

        .card {
            background: #020617;
            border-radius: .75rem;
            padding: .75rem 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
            border: 1px solid #1f2937;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp .35s ease forwards
        }

        .card:nth-child(1) {
            animation-delay: 40ms
        }

        .card:nth-child(2) {
            animation-delay: 80ms
        }

        .card:nth-child(3) {
            animation-delay: 120ms
        }

        .card-title {
            font-size: .9rem;
            font-weight: 600;
            margin-bottom: .4rem;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .card-title span {
            font-size: .75rem;
            color: #9ca3af;
            font-weight: 400
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: .15rem;
            font-size: .8rem
        }

        .list li {
            padding: .25rem .4rem;
            border-radius: .4rem;
            background: rgba(15, 23, 42, .8);
            border: 1px solid rgba(31, 41, 55, .7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(4px);
            animation: fadeUp .25s ease forwards
        }

        .list li:nth-child(odd) {
            background: rgba(15, 23, 42, .7)
        }

        .badge {
            border-radius: 999px;
            padding: .05rem .45rem;
            font-size: .65rem;
            text-transform: lowercase;
            border: 1px solid;
            margin-left: .35rem
        }

        .badge-pending {
            background: rgba(30, 64, 175, .2);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, .8)
        }

        .badge-active {
            background: rgba(59, 130, 246, .15);
            color: #60a5fa
        }

        .badge-solved {
            background: rgba(34, 197, 94, .15);
            color: #4ade80
        }

        .badge-failed {
            background: rgba(239, 68, 68, .18);
            color: #f87171
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: .5rem
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .8rem;
            margin-bottom: .25rem
        }

        .server-name {
            font-weight: 600
        }

        .server-pill {
            font-size: .65rem;
            border-radius: 999px;
            padding: .05rem .4rem;
            border: 1px solid #1f2937;
            color: #9ca3af
        }

        .server-requests {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: .75rem;
            display: flex;
            flex-direction: column;
            gap: .15rem
        }

        .server-none {
            font-size: .75rem;
            color: #6b7280;
            padding: .25rem .4rem;
            border-radius: .4rem;
            background: rgba(15, 23, 42, .65);
            border: 1px dashed #1f2937
        }

        .small {
            font-size: .7rem;
            color: #9ca3af;
            margin-top: .05rem
        }

        .results-container {
            grid-template-columns: 1fr
        }

        .algo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: .75rem;
            margin-top: .5rem
        }

        .algo-card {
            border-radius: .75rem;
            border: 1px solid #1f2937;
            padding: .5rem .75rem;
            background: #020617;
            font-size: .8rem
        }

        .algo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .25rem
        }

        .algo-name {
            font-weight: 600
        }

        .algo-tag {
            font-size: .7rem;
            padding: .1rem .4rem;
            border-radius: 999px;
            border: 1px solid #1f2937
        }

        .algo-metrics {
            list-style: none;
            padding: 0;
            margin: .25rem 0 0;
            font-size: .75rem
        }

        .algo-metrics li {
            margin-bottom: .1rem
        }

        .algo-empty {
            font-size: .75rem;
            color: #6b7280
        }

        .algo-server-list {
            list-style: none;
            padding: 0;
            margin: .3rem 0 0;
            font-size: .72rem;
            color: #9ca3af
        }

        .algo-server-list li {
            margin-bottom: .07rem
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px)
            }

            100% {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media(max-width:900px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch
            }

            .toolbar-right {
                align-items: flex-start
            }

            .container {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <h1>SDN Round-Robin Load Balancer – Live Schedule View</h1>
    <p class="subtitle">Edit the workload, run the experiment, and inspect how requests are scheduled across servers.
    </p>
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="textarea-wrapper">
                <div class="textarea-title">input/input.txt</div>
                <textarea id="input-editor" spellcheck="false"></textarea>
            </div>
        </div>
        <div class="toolbar-right">
            <button id="save-btn" class="btn-secondary">Save input</button>
            <button id="run-btn" class="btn-primary">Run experiment</button>
            <div class="status-row">
                <span id="spinner" class="spinner hidden"></span>
                <span id="status-label" class="status-text"><strong>Idle.</strong> Edit input and click Run
                    experiment.</span>
            </div>
            <div class="timeline">
                <span id="timeline-label"><strong>Sim time:</strong> 0 ms</span>
            </div>
            <div class="console-wrapper">
                <div class="console-title">Output console</div>
                <div id="log-panel" class="log-panel hidden"></div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="column">
            <div class="card">
                <div class="card-title">Client</div>
                <ul id="client-list" class="list"></ul>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <div class="card-title">Servers</div>
                <div id="servers" class="servers-grid"></div>
            </div>
        </div>
    </div>
    <div class="container results-container">
        <div class="column">
            <div class="card">
                <div class="card-title">Results</div>
                <div id="algo-results" class="algo-grid"></div>
            </div>
        </div>
    </div>
    <script>
        let globalSchedule = [];
        let globalStats = [];
        let statusPoll = null;

        function parseCsv(text) {
            const lines = text.trim().split(/\r?\n/);
            if (!lines.length) return [];
            const header = lines[0].split(",");
            return lines.slice(1).filter(Boolean).map(line => {
                const cols = line.split(",");
                const obj = {};
                header.forEach((h, i) => {
                    obj[h.trim()] = cols[i] ? cols[i].trim() : "";
                });
                if ("arrival_ms" in obj) obj.arrival_ms = obj.arrival_ms ? parseInt(obj.arrival_ms, 10) : null;
                if ("start_ms" in obj) obj.start_ms = obj.start_ms ? parseInt(obj.start_ms, 10) : null;
                if ("finish_ms" in obj) obj.finish_ms = obj.finish_ms ? parseInt(obj.finish_ms, 10) : null;
                return obj;
            });
        }

        function computeStatus(row, nowMs) {
            if (row.status === "too_consuming") return "failed";
            const a = row.arrival_ms;
            const s = row.start_ms;
            const f = row.finish_ms;
            if (a === null || s === null || f === null) return "pending";
            if (nowMs < a) return "future";
            if (nowMs < s) return "pending";
            if (nowMs < f) return "active";
            return "solved";
        }

        function computeNowMsFromSchedule(rows) {
            let m = 0;
            rows.forEach(r => {
                ["arrival_ms", "start_ms", "finish_ms"].forEach(k => {
                    const v = r[k];
                    if (typeof v === "number" && v > m) m = v;
                });
            });
            return m;
        }

        function renderAt(nowMs) {
            const clientList = document.getElementById("client-list");
            const serversRoot = document.getElementById("servers");
            clientList.innerHTML = "";
            serversRoot.innerHTML = "";
            const byServer = {};
            const rows = globalSchedule.map(r => {
                const st = computeStatus(r, nowMs);
                return { ...r, _status: st };
            });
            rows.forEach(row => {
                const key = row.server || "unassigned";
                if (!byServer[key]) byServer[key] = [];
                byServer[key].push(row);
            });
            const sortedByArrival = [...rows].sort((a, b) => (a.arrival_ms || 0) - (b.arrival_ms || 0));
            sortedByArrival.forEach((row, idx) => {
                const li = document.createElement("li");
                li.style.animationDelay = (idx * 40) + "ms";
                li.textContent = row.name + " · " + (row.arrival_ms ?? "-") + " ms";
                const badge = document.createElement("span");
                badge.classList.add("badge");
                if (row._status === "active") {
                    badge.classList.add("badge-active");
                    badge.textContent = "active";
                } else if (row._status === "pending") {
                    badge.classList.add("badge-pending");
                    badge.textContent = "pending";
                } else if (row._status === "solved") {
                    badge.classList.add("badge-solved");
                    badge.textContent = "solved";
                } else if (row._status === "failed") {
                    badge.classList.add("badge-failed");
                    badge.textContent = "too consuming";
                } else {
                    badge.classList.add("badge-pending");
                    badge.textContent = "future";
                }
                li.appendChild(badge);
                clientList.appendChild(li);
            });
            Object.keys(byServer).sort().forEach(serverName => {
                const card = document.createElement("div");
                card.className = "card";
                const title = document.createElement("div");
                title.className = "server-header";
                const nameSpan = document.createElement("div");
                nameSpan.className = "server-name";
                nameSpan.textContent = serverName;
                const pill = document.createElement("div");
                pill.className = "server-pill";
                const activeCount = byServer[serverName].filter(r => r._status === "active").length;
                const totalCount = byServer[serverName].length;
                pill.textContent = activeCount ? activeCount + " active · " + totalCount + " total" : totalCount + " requests";
                title.appendChild(nameSpan);
                title.appendChild(pill);
                card.appendChild(title);
                const ul = document.createElement("ul");
                ul.className = "server-requests";
                const serverRows = [...byServer[serverName]].sort((a, b) => (a.start_ms || 0) - (b.start_ms || 0));
                const activeRows = serverRows.filter(r => r._status === "active");
                const pendingRows = serverRows.filter(r => r._status === "pending" || r._status === "future");
                const doneRows = serverRows.filter(r => r._status === "solved" || r._status === "failed");
                const ordered = [...activeRows, ...pendingRows, ...doneRows];
                if (!ordered.length) {
                    const none = document.createElement("div");
                    none.className = "server-none";
                    none.textContent = "no active requests";
                    card.appendChild(none);
                } else {
                    ordered.forEach(row => {
                        const li = document.createElement("li");
                        let state = "pending";
                        let badgeClass = "badge-pending";
                        if (row._status === "active") {
                            state = "active";
                            badgeClass = "badge-active";
                        } else if (row._status === "solved") {
                            state = "solved";
                            badgeClass = "badge-solved";
                        } else if (row._status === "failed") {
                            state = "too consuming";
                            badgeClass = "badge-failed";
                        } else if (row._status === "future") {
                            state = "future";
                        }
                        let dur = "-";
                        if (row.start_ms != null && row.finish_ms != null) {
                            dur = row.finish_ms - row.start_ms;
                        }
                        li.innerHTML = "<strong>" + row.name + "</strong>" +
                            "<span class='badge " + badgeClass + "'>" + state + "</span>" +
                            "<div class='small'>start " + (row.start_ms ?? "-") + " · finish " + (row.finish_ms ?? "-") + " · " + dur + " ms</div>";
                        ul.appendChild(li);
                    });
                }
                card.appendChild(ul);
                serversRoot.appendChild(card);
            });
            document.getElementById("timeline-label").innerHTML = "<strong>Sim time:</strong> " + Math.max(0, Math.round(nowMs)) + " ms";
        }

        function renderStats() {
            const root = document.getElementById("algo-results");
            if (!root) return;
            root.innerHTML = "";
            const algorithms = ["Round Robin", "Weighted Round Robin", "Least Connections", "Least Bandwidth", "Custom Algorithm"];
            algorithms.forEach(name => {
                const card = document.createElement("div");
                card.className = "algo-card";
                const header = document.createElement("div");
                header.className = "algo-header";
                const title = document.createElement("div");
                title.className = "algo-name";
                title.textContent = name;
                const tag = document.createElement("div");
                tag.className = "algo-tag";
                if (name === "Round Robin") tag.textContent = "active"; else tag.textContent = "pending";
                header.appendChild(title);
                header.appendChild(tag);
                card.appendChild(header);
                let globalRow = null;
                let serverRows = [];
                if (name === "Round Robin") {
                    globalRow = globalStats.find(r => r.scope === "global");
                    serverRows = globalStats.filter(r => r.scope === "server");
                }
                if (!globalRow) {
                    const empty = document.createElement("div");
                    empty.className = "algo-empty";
                    empty.textContent = "No data yet.";
                    card.appendChild(empty);
                } else {
                    const ul = document.createElement("ul");
                    ul.className = "algo-metrics";
                    const total = parseInt(globalRow.requests || "0", 10) || 0;
                    const completed = parseInt(globalRow.completed || "0", 10) || 0;
                    const failed = parseInt(globalRow.failed || "0", 10) || 0;
                    const li1 = document.createElement("li");
                    li1.textContent = "Requests: " + completed + "/" + total + " (failed " + failed + ")";
                    ul.appendChild(li1);
                    const li2 = document.createElement("li");
                    li2.textContent = "Avg response: " + (globalRow.avg_response_ms || "-") + " ms";
                    ul.appendChild(li2);
                    const li3 = document.createElement("li");
                    li3.textContent = "Avg wait: " + (globalRow.avg_wait_ms || "-") + " ms";
                    ul.appendChild(li3);
                    const li4 = document.createElement("li");
                    li4.textContent = "Utilization: " + (globalRow.utilization || "-") + " %";
                    ul.appendChild(li4);
                    const li5 = document.createElement("li");
                    li5.textContent = "Busy: " + (globalRow.busy_ms || "-") + " ms · Idle: " + (globalRow.idle_ms || "-") + " ms";
                    ul.appendChild(li5);
                    if (serverRows.length) {
                        const serverList = document.createElement("ul");
                        serverList.className = "algo-server-list";
                        serverRows.forEach(r => {
                            const li = document.createElement("li");
                            const util = r.utilization || "-";
                            li.textContent = r.name + ": " + (r.requests || "0") + " req · util " + util + " %";
                            serverList.appendChild(li);
                        });
                        card.appendChild(serverList);
                    }
                    card.appendChild(ul);
                }
                root.appendChild(card);
            });
        }

        function loadStats() {
            return fetch("/results/stats.csv?" + Date.now())
                .then(r => r.ok ? r.text() : "")
                .then(t => {
                    if (!t) {
                        globalStats = [];
                        renderStats();
                        return;
                    }
                    globalStats = parseCsv(t);
                    renderStats();
                })
                .catch(() => {
                    globalStats = [];
                    renderStats();
                });
        }

        function setStatus(text, mode) {
            const spinner = document.getElementById("spinner");
            const label = document.getElementById("status-label");
            if (mode === "running") spinner.classList.remove("hidden"); else spinner.classList.add("hidden");
            label.innerHTML = text;
        }

        function appendLog(output) {
            const panel = document.getElementById("log-panel");
            if (!output) {
                panel.classList.add("hidden");
                panel.textContent = "";
                return;
            }
            panel.classList.remove("hidden");
            const lines = output.trim().split(/\r?\n/);
            panel.innerHTML = "";
            lines.forEach(line => {
                const div = document.createElement("div");
                if (line.includes("LB DECISION")) div.className = "log-panel-line-highlight";
                div.textContent = line;
                panel.appendChild(div);
            });
            panel.scrollTop = panel.scrollHeight;
        }

        function saveInput() {
            const text = document.getElementById("input-editor").value;
            return fetch("/api/save-input", {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: text
            }).then(r => {
                if (!r.ok) throw new Error("Failed to save");
            });
        }

        function loadInput() {
            return fetch("/api/load-input")
                .then(r => r.ok ? r.text() : "")
                .then(text => {
                    document.getElementById("input-editor").value = text || "";
                });
        }

        function refreshState() {
            return Promise.all([
                fetch("/api/status").then(r => r.json()),
                fetch("/results/schedule.csv?" + Date.now()).then(r => r.ok ? r.text() : "")
            ]).then(([status, schText]) => {
                if (status.running) {
                    setStatus("<strong>Running…</strong> This may take a few seconds.", "running");
                } else if (status.exit_code != null) {
                    setStatus("<strong>Done.</strong> Exit code " + status.exit_code + ".", "idle");
                } else {
                    setStatus("<strong>Idle.</strong> Edit input and click Run experiment.", "idle");
                }
                appendLog(status.output || "");
                if (schText) {
                    globalSchedule = parseCsv(schText).filter(row => row.name);
                    const nowMs = computeNowMsFromSchedule(globalSchedule);
                    renderAt(nowMs);
                } else {
                    globalSchedule = [];
                    renderAt(0);
                }
                if (status.running) {
                    statusPoll = setTimeout(refreshState, 500);
                } else {
                    statusPoll = null;
                    loadStats();
                }
            }).catch(() => {
                if (statusPoll) {
                    statusPoll = setTimeout(refreshState, 1000);
                }
            });
        }

        function runExperiment() {
            const saveBtn = document.getElementById("save-btn");
            const runBtn = document.getElementById("run-btn");
            saveBtn.disabled = true;
            runBtn.disabled = true;
            if (statusPoll) {
                clearTimeout(statusPoll);
                statusPoll = null;
            }
            setStatus("<strong>Running…</strong> This may take a few seconds.", "running");
            appendLog("");
            globalSchedule = [];
            renderAt(0);
            saveInput()
                .then(() => fetch("/api/run", { method: "POST" }))
                .then(r => r.json())
                .then(res => {
                    if (res.status === "started") {
                        refreshState();
                    } else if (res.status === "busy") {
                        setStatus("<strong>Already running.</strong>", "running");
                        refreshState();
                    } else {
                        setStatus("<strong>Error.</strong> See console.", "idle");
                    }
                })
                .catch(() => {
                    setStatus("<strong>Error.</strong> See console.", "idle");
                })
                .finally(() => {
                    saveBtn.disabled = false;
                    runBtn.disabled = false;
                });
        }

        document.getElementById("save-btn").addEventListener("click", function () {
            setStatus("<strong>Saving…</strong>", "running");
            saveInput()
                .then(() => { setStatus("<strong>Saved.</strong> You can now run the experiment.", "idle"); })
                .catch(() => {
                    setStatus("<strong>Error saving.</strong>", "idle");
                });
        });

        document.getElementById("run-btn").addEventListener("click", function () {
            runExperiment();
        });

        loadInput()
            .then(() => refreshState())
            .catch(() => {
                globalSchedule = [];
                renderAt(0);
            });
    </script>
</body>

</html>
